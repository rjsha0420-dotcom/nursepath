<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner shield ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Medical Cross Badge with Gold Accent -->
  <g transform="translate(256,236)">
    <!-- White Medical Cross -->
    <rect x="-42" y="-110" width="84" height="220" rx="20" fill="#ffffff"/>
    <rect x="-110" y="-42" width="220" height="84" rx="20" fill="#ffffff"/>

    <!-- Gold Center Stethoscope Heart / Pulse -->
    <circle cx="0" cy="0" r="32" fill="url(#gold)"/>
    <path d="M-18 2 L-8 2 L-3 -14 L4 16 L9 -6 L14 2 L20 2" fill="none" stroke="#042f2e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nurse Cap Top Arc -->
  <path d="M196 110 C216 95 296 95 316 110 C326 126 316 142 306 142 L206 142 C196 142 186 126 196 110 Z" fill="#ffffff" opacity="0.95"/>
  <rect x="248" y="118" width="16" height="16" rx="3" fill="#0f766e"/>

  <!-- Bottom Brand Label -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#ffffff">NURSEPATH</text>
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#5eead4">BSN &amp; PNLE MASTERY</text>
</svg>
