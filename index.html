  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Progressive Web App Service Worker for Offline Study Materials
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('NURSEPATH ServiceWorker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('ServiceWorker registration error:', err);
            });
        });
      }
    </script>
  </body>
